# Linux-Mastery — static site, no build step
[build]
  publish = "."

# ReconKit: iframe-embeddable (specific rule MUST come before the catch-all)
[[headers]]
  for = "/reconkit.html"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Default: no frame embedding
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
